    <div class="modal-footer">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="sync-connect-btn">Connect</button>
    </div>
  </div>`;
  showModal(html);

  document.getElementById('sync-connect-btn').onclick = async () => {
    const token = document.getElementById('sync-token').value.trim();
    const gistIdInput = document.getElementById('sync-gist-id').value.trim();
    if(!token){ toast('Token required', 'error'); return; }
    const btn = document.getElementById('sync-connect-btn');
    btn.disabled = true; btn.textContent = 'Connecting…';
    try{
      let finalGistId = gistIdInput;
      if(gistIdInput){
        // Existing gist — fetch & pull
        const gist = await syncFetchGist(token, gistIdInput);
        const file = gist.files && gist.files['trading-journal.json'];
        if(file){
          if(state.trades.length > 0){
            const ok = confirm('You have ' + state.trades.length + ' local trades. Connecting will REPLACE them with the cloud data. Push your local data instead? Click OK to replace with cloud, Cancel to keep local (we\'ll then push to overwrite cloud).');
            if(!ok){
              // Push local instead
              state.settings.sync = { enabled:true, githubToken:token, gistId:gistIdInput, lastSyncedAt:new Date().toISOString(), lastError:null, autoSync:true };
              await syncUpdateGist(token, gistIdInput, getSyncableState());
              saveState(); closeModal(); renderSidebar(); renderMain();
              toast('Cloud overwritten with local data', 'success');
              return;
            }
          }
          syncSuspended = true;
          applyPulledData(JSON.parse(file.content));
          syncSuspended = false;
        }
      } else {
        // Create new gist with current state
        const gist = await syncCreateGist(token);
        finalGistId = gist.id;
      }
      state.settings.sync = {
        enabled: true,
        githubToken: token,
        gistId: finalGistId,
        lastSyncedAt: new Date().toISOString(),

      };
      saveState();
      closeModal();
      renderSidebar(); renderMain();
      setSyncStatus('synced', 'Connected');
      toast('Cloud sync enabled — Gist ID: ' + finalGistId.slice(0,8) + '…', 'success');
    }catch(e){
      btn.disabled = false; btn.textContent = 'Connect';
      toast('Connect failed: ' + e.message, 'error');
    }
  };
}

function disconnectSync(){
  if(!confirm('Disconnect cloud sync? Your local data stays. The cloud gist remains in your GitHub account (you can delete it manually or reconnect later).')) return;
  state.settings.sync = { ...DEFAULT_SYNC };
  saveState();
  renderMain();
  setSyncStatus('off');
  toast('Sync disconnected', 'success');
}

  const sync = (state.settings && state.settings.sync) || DEFAULT_SYNC;
  const configured = isSyncConfigured();
  const lastSync = sync.lastSyncedAt ? new Date(sync.lastSyncedAt).toLocaleString() : 'never';
  if(!configured){

      <h3>☁ Cloud Sync</h3>

          <input type="checkbox" id="sync-auto-toggle" ${sync.autoSync?'checked':''} style="cursor:pointer;accent-color:var(--primary)"/>

/* ---------- Add account quick prompt ---------- */
function addAccountPrompt(){
  const name = prompt('Account name:');
  if(!name || !name.trim()) return;
  const acc = {id: uid(), name: name.trim()};
  state.accounts.push(acc);
  state.activeAccountId = acc.id;
  saveState(); renderSidebar(); renderMain();
  toast('Account added', 'success');
}

/* ---------- Sidebar event wiring ---------- */
function wireSidebar(){
  document.querySelectorAll('.nav-item[data-view]').forEach(b => b.onclick = () => { setView(b.dataset.view); toggleSidebar(false); });
  document.getElementById('log-trade-btn').onclick = () => { openTradeForm(); toggleSidebar(false); };
  document.getElementById('add-account').onclick = addAccountPrompt;
  document.getElementById('import-btn').onclick = () => { setView('setup'); toggleSidebar(false); setTimeout(() => document.getElementById('export-btn')?.scrollIntoView({behavior:'smooth', block:'center'}), 50); };
  document.getElementById('sync-status').onclick = () => { setView('setup'); toggleSidebar(false); setTimeout(() => document.getElementById('setup-sync-btn')?.scrollIntoView({behavior:'smooth', block:'center'}) || document.getElementById('sync-push-btn')?.scrollIntoView({behavior:'smooth', block:'center'}), 50); };
  // Mobile bottom nav
  document.querySelectorAll('.mobile-nav-item[data-mobile-view]').forEach(b => b.onclick = () => setView(b.dataset.mobileView));
  document.getElementById('mobile-log-btn').onclick = () => openTradeForm();
  // Backdrop closes sidebar
  document.getElementById('sidebar-backdrop').onclick = () => toggleSidebar(false);
  // brand name editing
  document.getElementById('brand-name').addEventListener('blur', e => {
    const name = e.target.textContent.trim() || 'My';
    e.target.textContent = name;
    state.ownerName = name;
    saveState();
  });
  document.getElementById('brand-name').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
  });
  // account list (delegate)
  document.getElementById('account-list').onclick = (e) => {
    const del = e.target.closest('[data-del]');
    if(del){
      e.stopPropagation();
      const acc = state.accounts.find(a => a.id === del.dataset.del);
      const ct = countTrades(del.dataset.del);
      if(!confirm(`Delete account "${acc.name}"${ct?` and all ${ct} trades`:''}?`)) return;
      state.accounts = state.accounts.filter(a => a.id !== del.dataset.del);
      state.trades = state.trades.filter(t => t.accountId !== del.dataset.del);
      if(state.activeAccountId === del.dataset.del) state.activeAccountId = state.accounts[0].id;
      saveState(); renderSidebar(); renderMain();
      return;
    }
    const item = e.target.closest('[data-account]');
    if(item) setActiveAccount(item.dataset.account);
  };
  // overlay click to close (only if clicking the overlay itself, not the modal inside)
  document.getElementById('overlay').addEventListener('click', e => {
    if(e.target.id === 'overlay') closeModal();
  });
  // Esc to close
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
  // Cmd/Ctrl-N to log new trade
  document.addEventListener('keydown', e => {
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n'){
      e.preventDefault(); openTradeForm();
    }
  });
}

/* ---------- Init ---------- */
function init(){
  renderSidebar();
  wireSidebar();
  renderMain();
  // Try cloud sync on load (suspended push during pull to avoid loops)
  syncSuspended = true;
  syncAutoOnLoad().finally(() => { syncSuspended = false; });
  // Show welcome toast on first run
  if(state.trades.length === 0 && !localStorage.getItem(STORAGE_KEY + '_welcomed')){
    setTimeout(() => {
      toast('Welcome! Click "+ Log Trade" or load demo data in Setup.', 'success');
      localStorage.setItem(STORAGE_KEY + '_welcomed', '1');
    }, 400);
  }
}
init();
// Push pending changes when tab is closed/hidden
window.addEventListener('beforeunload', () => {
  if(pushTimeout && isSyncConfigured()){
    clearTimeout(pushTimeout);
    // Best-effort sync push (sendBeacon-style fetch)
    try{
      const sync = state.settings.sync;
      navigator.sendBeacon && navigator.sendBeacon(
        'https://api.github.com/gists/' + sync.gistId,
        new Blob([JSON.stringify({files:{'trading-journal.json':{content:JSON.stringify(getSyncableState())}}})], {type:'application/json'})
      );
    }catch(_){}
  }
});
// On tab visibility regain, try to pull
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && isSyncConfigured() && state.settings.sync.enabled){
    syncAutoOnLoad();
  }
});
</script>
